name: Production Major Release

permissions:
  contents: write

on:
  workflow_run:
    workflows:
      - Production Automated Security Checks
    types:
      - completed

jobs:
  build:
    runs-on: self-hosted

    if: |
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'neutral'

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm build:cicd

      - name: Check if new version should be tagged
        id: version_gate
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');

            const current = JSON.parse(
              fs.readFileSync('package.json', 'utf8')
            ).version;

            let latest = '0.0.0';

            try {
              latest = cp.execSync(
                'git describe --tags --abbrev=0',
                { encoding: 'utf8' }
              ).trim().replace(/^v/, '');
            } catch {
              latest = '0.0.0';
            }

            function compare(a, b) {
              const pa = a.split('.').map(Number);
              const pb = b.split('.').map(Number);

              for (let i = 0; i < 3; i++) {
                if ((pa[i] || 0) > (pb[i] || 0)) return 1;
                if ((pa[i] || 0) < (pb[i] || 0)) return -1;
              }

              return 0;
            }

            const shouldTag = compare(current, latest) > 0;

            core.setOutput('current', current);
            core.setOutput('should_tag', shouldTag ? 'true' : 'false');

            core.info(`Package version : ${current}`);
            core.info(`Latest tag      : ${latest}`);
            core.info(`Create tag      : ${shouldTag}`);

      - name: Create and push tag
        if: steps.version_gate.outputs.should_tag == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.version_gate.outputs.current }}
        with:
          script: |
            const cp = require('child_process');

            const tag = `v${process.env.RELEASE_VERSION}`;

            try {
              cp.execSync(
                `git ls-remote --exit-code origin refs/tags/${tag}`,
                { stdio: 'ignore' }
              );

              core.info(`Tag ${tag} already exists. Skipping.`);
              return;
            } catch {
              // Tag doesn't exist
            }

            cp.execSync('git config user.name "github-actions[bot]"');
            cp.execSync('git config user.email "41898282+github-actions[bot]@users.noreply.github.com"');

            cp.execSync(`git tag ${tag}`);
            cp.execSync(`git push origin ${tag}`, {
              stdio: 'inherit'
            });

            core.info(`Created ${tag}`);